<!doctype html>
<html lang="%site.language%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<style>
			.docs-framework-content {
				display: none;
			}

			.docs-framework-content[data-default='true'] {
				display: block;
			}

			html[data-docs-framework] .docs-framework-content {
				display: none !important;
			}

			html[data-docs-framework='svelte'] .docs-framework-content[data-framework='svelte'],
			html[data-docs-framework='react'] .docs-framework-content[data-framework='react'],
			html[data-docs-framework='vue'] .docs-framework-content[data-framework='vue'] {
				display: block !important;
			}

			html[data-docs-framework]:not([data-docs-framework-ready])
				[data-slot='tabs-trigger'][data-framework] {
				color: var(--muted-foreground) !important;
			}

			html[data-docs-framework]:not([data-docs-framework-ready])
				[data-slot='tabs-trigger'][data-framework]::after {
				opacity: 0 !important;
			}

			html[data-docs-framework='svelte']:not([data-docs-framework-ready])
				[data-slot='tabs-trigger'][data-framework='svelte'],
			html[data-docs-framework='react']:not([data-docs-framework-ready])
				[data-slot='tabs-trigger'][data-framework='react'],
			html[data-docs-framework='vue']:not([data-docs-framework-ready])
				[data-slot='tabs-trigger'][data-framework='vue'] {
				color: var(--foreground) !important;
			}

			html[data-docs-framework='svelte']:not([data-docs-framework-ready])
				[data-slot='tabs-trigger'][data-framework='svelte']::after,
			html[data-docs-framework='react']:not([data-docs-framework-ready])
				[data-slot='tabs-trigger'][data-framework='react']::after,
			html[data-docs-framework='vue']:not([data-docs-framework-ready])
				[data-slot='tabs-trigger'][data-framework='vue']::after {
				opacity: 1 !important;
			}

			html[data-docs-framework]:not([data-docs-framework-ready]) .installation-framework-icon {
				scale: 0.25 !important;
				opacity: 0 !important;
				filter: blur(4px) !important;
				transition: none !important;
			}

			html[data-docs-framework='svelte']:not([data-docs-framework-ready])
				.installation-framework-icon[data-framework='svelte'],
			html[data-docs-framework='react']:not([data-docs-framework-ready])
				.installation-framework-icon[data-framework='react'],
			html[data-docs-framework='vue']:not([data-docs-framework-ready])
				.installation-framework-icon[data-framework='vue'] {
				scale: 1 !important;
				opacity: 1 !important;
				filter: none !important;
			}
		</style>
		<script>
			(() => {
				document.documentElement.classList.add('js');

				const config = %site.preferences%;
				const read = (key) => { try { return localStorage.getItem(key); } catch { return null; } };
				const storedTheme = read(config.theme.storageKey);
				const theme = storedTheme === 'light' || storedTheme === 'dark' ? storedTheme : config.theme.defaultMode;
				const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.toggle('dark', isDark);
				document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
				const preference = (setting) => {
					const value = read(setting.storageKey);
					return setting.enabled.includes(value) ? value : setting.default;
				};
				document.documentElement.dataset.docsPackageManager = preference(config.packageManager);
				document.documentElement.dataset.docsFramework = preference(config.framework);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
